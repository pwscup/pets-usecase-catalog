<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>5分でわかる開発</title>
<!--
  このページは docs/slides.md を読み込んで表示するだけです。本文はここに書かないでください。
  slides.md は「---」だけの行で区切ります（スライドの中では区切り線を使えません）。
-->
<style>
  :root {
    --bg: #eef0f4;
    --slide-bg: #ffffff;
    --fg: #1d2330;
    --fg-soft: #5b6472;
    --border: #dde1e7;
    --accent: #2457c5;
    --code-bg: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1014;
      --slide-bg: #1b1f26;
      --fg: #e4e7ec;
      --fg-soft: #a3abb8;
      --border: #2e343e;
      --accent: #7fa6ff;
      --code-bg: #262b34;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;
    --slide-bg: #1b1f26;
    --fg: #e4e7ec;
    --fg-soft: #a3abb8;
    --border: #2e343e;
    --accent: #7fa6ff;
    --code-bg: #262b34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .deck { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .slide {
    display: none;
    width: min(100%, calc((100vh - 96px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: var(--slide-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4.5% 6%;
    overflow: hidden;
    font-size: clamp(14px, 1.6vw, 26px);
    line-height: 1.6;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
  }
  .slide.active { display: flex; flex-direction: column; justify-content: center; }
  .slide h1 { font-size: 1.75em; margin: 0 0 .8em; line-height: 1.3; }
  .slide ul, .slide ol { margin: 0; padding-left: 1.3em; }
  .slide li { margin: .25em 0; }
  .slide a { color: var(--accent); }
  .slide code { background: var(--code-bg); padding: .05em .3em; border-radius: 4px; font-size: .9em; }
  .slide table { border-collapse: collapse; width: 100%; font-size: .9em; }
  .slide th, .slide td { border: 1px solid var(--border); padding: .35em .6em; text-align: left; }
  .slide th { color: var(--fg-soft); }
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center; gap: 16px;
    padding: 10px;
    font-size: 14px;
    color: var(--fg-soft);
  }
  .bar button {
    font: inherit;
    color: var(--fg);
    background: var(--slide-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 14px;
    cursor: pointer;
  }
  .bar a { color: var(--accent); }
  .raw { white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; padding: 16px; }
  /* スマホ：縦に並べてスクロール */
  @media (max-width: 800px) {
    .deck { height: auto; display: block; padding: 16px; }
    .slide {
      display: block;
      width: auto;
      aspect-ratio: auto;
      margin: 0 0 16px;
      padding: 20px 18px;
      font-size: 15px;
      overflow: visible;
    }
    .slide h1 { font-size: 20px; margin-bottom: 12px; }
    .slide table { display: block; overflow-x: auto; }
    .bar { display: none; }
  }
</style>
</head>
<body>
<div id="deck" class="deck">読み込み中…</div>
<div class="bar" id="bar" hidden>
  <button type="button" id="prev" aria-label="前のスライド">←</button>
  <span id="pos"></span>
  <button type="button" id="next" aria-label="次のスライド">→</button>
  <a href="index.html">ドキュメントへ</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const GITHUB_BLOB = 'https://github.com/pwscup/pets-usecase-catalog/blob/develop/';
  let slides = [];
  let current = 0;

  // slides.md を「---」だけの行で区切る
  function split(md) {
    return md.split(/^---\s*$/m).map((s) => s.trim()).filter(Boolean);
  }

  // リンクを振り分ける：docs/ 内の .md は閲覧ページで開く。それ以外は GitHub
  function rewriteLinks(root) {
    for (const a of root.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href');
      if (/^(https?:|mailto:|#)/.test(href)) {
        if (!href.startsWith('#')) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        continue;
      }
      const [target, frag] = href.split('#');
      if (!target.startsWith('..') && target.endsWith('.md')) {
        a.href = 'index.html#' + target.replace(/\.md$/, '') + (frag ? '::' + frag : '');
      } else {
        a.href = GITHUB_BLOB + 'docs/' + target + (frag ? '#' + frag : '');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    }
  }

  function isMobile() {
    return window.matchMedia('(max-width: 800px)').matches;
  }

  function go(i) {
    if (!slides.length) return;
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === current));
    document.getElementById('pos').textContent = (current + 1) + ' / ' + slides.length;
    const want = '#' + (current + 1);
    if (location.hash !== want) history.replaceState(null, '', want);
  }

  function fromHash() {
    const n = parseInt(location.hash.replace('#', ''), 10);
    return Number.isFinite(n) ? n - 1 : 0;
  }

  async function init() {
    const deck = document.getElementById('deck');
    let md;
    try {
      const res = await fetch('slides.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      md = await res.text();
    } catch (e) {
      deck.textContent = 'slides.md を読み込めませんでした（' + e.message + '）。リポジトリの直下で「python3 -m http.server 8000」を実行し、http://localhost:8000/docs/slides.html から開いてください。';
      return;
    }

    deck.textContent = '';
    if (typeof window.marked === 'undefined') {
      // 表示ライブラリを読み込めないときは原文をそのまま出す
      const raw = document.createElement('div');
      raw.className = 'raw';
      raw.textContent = md;
      deck.style.display = 'block';
      deck.style.height = 'auto';
      deck.appendChild(raw);
      return;
    }

    for (const part of split(md)) {
      const sec = document.createElement('section');
      sec.className = 'slide';
      sec.innerHTML = window.marked.parse(part, { gfm: true });
      rewriteLinks(sec);
      deck.appendChild(sec);
    }
    slides = Array.from(deck.querySelectorAll('.slide'));
    document.getElementById('bar').hidden = false;
    go(fromHash());

    document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); go(current - 1); });
    document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); go(current + 1); });
    document.addEventListener('keydown', (e) => {
      if (isMobile()) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') go(0);
      if (e.key === 'End') go(slides.length - 1);
    });
    // スライドをクリックすると次へ（左側3分の1なら前へ）。リンクのクリックは除く
    deck.addEventListener('click', (e) => {
      if (isMobile() || e.target.closest('a')) return;
      const rect = deck.getBoundingClientRect();
      if (e.clientX - rect.left < rect.width / 3) go(current - 1);
      else go(current + 1);
    });
    window.addEventListener('hashchange', () => go(fromHash()));
  }

  init();
</script>
</body>
</html>
